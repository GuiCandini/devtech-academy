
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy</title>
</head>
<body>

    <h1>DevTech Academy</h1>
    <h2>Cadastro de Alunos</h2>

    <form id="formAluno">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        
        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="1" required>

        <label for="curso">Curso:</label>
        <select id="curso" required>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
        </select>

        <label for="notaFinal">Nota Final:</label>
        <input type="number" id="notaFinal"
               min="0" max="10" step="0.1" required>

        <button type="submit" id="btnCadastrar">
            Cadastrar
        </button>
    </form>

    <h2>Lista de Alunos</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaAlunos"></tbody>
    </table>

    <h2>Relatórios</h2>

    <button id="btnAprovados">Alunos Aprovados</button>
    <button id="btnMediaNotas">Média das Notas</button>
    <button id="btnMediaIdades">Média das Idades</button>
    <button id="btnOrdem">Ordem Alfabética</button>
    <button id="btnCursos">Alunos por Curso</button>

    <div id="resultadoRelatorio"></div>

    <script src="script.js"></script>
</body>
</html>
